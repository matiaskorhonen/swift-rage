[package]
name = "swift-rage-ffi"
version = "0.1.0"
edition = "2021"

[dependencies]
age.workspace = true
uniffi.workspace = true
secrecy = "0.10"
thiserror = "2"
uuid = { version = "1.0", features = ["v4"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[lib]
crate-type = ["lib", "staticlib"]
name = "swift_rage_ffi"
